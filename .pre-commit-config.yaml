repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-lint
        name: ruff check
        entry: uv run ruff check src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: ty-check
        name: ty check
        entry: uv run ty check src
        language: system
        types: [python]
        pass_filenames: false
