name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide details below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: I would like git-bifurcate to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered

  - type: dropdown
    id: phase
    attributes:
      label: Implementation Phase
      description: Which phase does this relate to? (See ARCHITECTURE.md)
      options:
        - Phase 1 - MVP (File-level only)
        - Phase 2 - Hunk Level
        - Phase 3 - Robustness
        - Phase 4 - Advanced Features
        - Not sure / Other

  - type: textarea
    id: examples
    attributes:
      label: Use Cases / Examples
      description: Provide examples of how this would be used

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references
